name: Windows desktop release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lighthouse-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Assign unique desktop version
        shell: pwsh
        run: |
          $desktopVersion = "0.1.${{ github.run_number }}"
          npm version $desktopVersion --no-git-tag-version
          "DESKTOP_VERSION=$desktopVersion" >> $env:GITHUB_ENV

      - name: Build Windows installer
        run: npm run desktop:pack

      - name: Create version tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$env:DESKTOP_VERSION" $env:GITHUB_SHA
          git push origin "v$env:DESKTOP_VERSION"

      - name: Publish Windows release
        shell: pwsh
        run: |
          $installer = "release/Lighthouse-Lodge-Setup-$env:DESKTOP_VERSION.exe"
          gh release create "v$env:DESKTOP_VERSION" `
            $installer `
            "$installer.blockmap" `
            "release/latest.yml" `
            --repo "${{ github.repository }}" `
            --title "Lighthouse Lodge $env:DESKTOP_VERSION" `
            --generate-notes `
            --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
